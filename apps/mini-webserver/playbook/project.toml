[project]
name = "mini-webserver"
title = "Mini Webserver"
type = "customtkinter-desktop"
language = "de"
license = "MIT"
version = "1.1.0"

[runtime]
entry = "main.py"
python = ">=3.9"
default_port = 8080

[build]
tool = "pyinstaller"
output = "dist/MiniWebserver.exe"

[quality]
tests = "python -m unittest discover -s tests"
